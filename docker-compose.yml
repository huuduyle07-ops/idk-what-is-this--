services:
  cattus-web:
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "false"
        INSTALL_OLLAMA_CLIENT: "false"
    ports:
      - "5056:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
    environment:
      WEB_HOST: "0.0.0.0"
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/codex_db
      DB_ENABLED: "true"
      ROUTER_USE_EMBEDDINGS: "false"
      INDEX_USE_EMBEDDINGS: "false"
      RETRIEVER_USE_EMBEDDINGS: "false"
      # Phase 9.1b — pluggable embedding provider.
      # Default "off" keeps the image lean: no sentence-transformers / Torch
      # in Docker Compose by default. Set to "gemini" (remote, no install) or
      # "local_minilm" (rebuild with INSTALL_EMBEDDINGS=true) to enable vector
      # retrieval. Provider+model+dimension are persisted to the index
      # metadata; changing them requires a re-index.
      EMBEDDING_PROVIDER: "off"
      OLLAMA_ENABLED: "false"
      SANDBOX_BACKEND: "temp_clone"

  db:
    image: pgvector/pgvector:pg16
    container_name: mini-codex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: codex_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d codex_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ubuntu-sandbox:
    image: ubuntu:24.04
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    network_mode: "none"

  python-sandbox:
    image: python:3.12-slim
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    network_mode: "none"
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama: