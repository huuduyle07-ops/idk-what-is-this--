version: "3.8"

services:
  app:
    build: .
    container_name: ai-mentor-app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - db
      - ollama
    ports:
      - "5000:5000"

  db:
    image: pgvector/pgvector:pg16
    container_name: mini-codex-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama: